name: Build PathToMoksha

"on":
  push:
    branches:
      - main
    paths-ignore:
      - "version 1/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which folder to build"
        type: choice
        options:
          - version2
          - version1
        default: version2

permissions:
  contents: write

env:
  # Auto (push/tag) builds always target version 2 — the active dev line.
  # A manual run can override via the workflow_dispatch "target" input.
  TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && format('version {0}', github.event.inputs.target == 'version1' && '1' || '2') || 'version 2' }}

jobs:
  test:
    name: Portable unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dependency-free tests
        working-directory: ${{ env.TARGET_DIR }}
        run: python -m unittest discover -s tests -v

  build-windows:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        working-directory: ${{ env.TARGET_DIR }}
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        working-directory: ${{ env.TARGET_DIR }}
        run: python -m PyInstaller PathToMoksha.spec --noconfirm --clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.TARGET_DIR }}/dist/PathToMoksha.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS app
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and archive macOS app
        working-directory: ${{ env.TARGET_DIR }}
        env:
          BUILD_VENV: ${{ runner.temp }}/path-to-moksha-build-venv
        run: ./build_macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ env.TARGET_DIR }}/dist/PathToMoksha-mac.zip
          if-no-files-found: error
          retention-days: 30

  # NOTE: the `commit-builds` job that used to live here was removed (V2_TASKS A1).
  # It ran `git add dist/PathToMoksha.exe`, which cannot succeed now that
  # `dist/` is ignored — see DECISION_LOG "stop tracking dist/": build output in
  # git had grown .git to 330 MB. Builds are still reachable as workflow
  # artifacts (30-day retention) and, on a v* tag, as GitHub Release assets.

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/PathToMoksha.exe \
            release-assets/PathToMoksha-mac.zip \
            --clobber
